trigger:
  branches:
    include:
      - main
  paths:
    include:
      - index.html
      - staticwebapp.config.json

pr:
  branches:
    include:
      - main

stages:

- stage: Build_And_Deploy
  displayName: 'Build & Deploy to Azure Static Web Apps'
  jobs:
  - job: Deploy
    displayName: 'Deploy IPL Dashboard'
    pool:
      name: 'local-mac'

    steps:
    - checkout: self

    - script: npm install -g @azure/static-web-apps-cli
      displayName: 'Install SWA CLI'

    - script: |
        swa deploy ./ \
          --deployment-token $(azureStaticWebAppsApiToken) \
          --env production
      displayName: 'Deploy to Azure Static Web Apps'

    - script: |
        echo "========================================="
        echo "  IPL 2026 Dashboard - Deployment Done"
        echo "  Branch : $(Build.SourceBranchName)"
        echo "  Commit : $(Build.SourceVersion)"
        echo "  Time   : $(date '+%Y-%m-%d %H:%M:%S')"
        echo "========================================="
      displayName: 'Print Deployment Summary'